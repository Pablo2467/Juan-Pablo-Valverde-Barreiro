<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="640" fill="#0b0e13"/>

  <!-- Header block -->
  <rect x="24" y="24" width="912" height="90" rx="10" fill="none" stroke="#3a4354" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="40" y="52" fill="#97ce4c" font-size="12" letter-spacing="2">EYEBROW LABEL</text>
  <text x="40" y="80" fill="#edeff3" font-size="24" font-weight="bold">Citizen Directory (H1 + subtitle)</text>
  <rect x="760" y="45" width="150" height="36" rx="8" fill="none" stroke="#3a4354" stroke-width="1.5"/>
  <text x="785" y="68" fill="#8a93a6" font-size="12">Prev / Page N / Next</text>

  <!-- Loading state annotation -->
  <text x="40" y="140" fill="#8a93a6" font-size="13">State A — LOADING (shown while fetch() is in flight)</text>
  <circle cx="480" cy="185" r="20" fill="none" stroke="#97ce4c" stroke-width="4" stroke-dasharray="70 40"/>
  <text x="440" y="225" fill="#8a93a6" font-size="12">spinner + "Loading..." message</text>

  <!-- Divider -->
  <line x1="24" y1="255" x2="936" y2="255" stroke="#3a4354" stroke-width="1"/>

  <!-- Success state: grid of cards -->
  <text x="40" y="280" fill="#8a93a6" font-size="13">State B — SUCCESS (grid of items once data arrives)</text>
  <g id="card-template">
    <rect x="40" y="295" width="270" height="150" rx="12" fill="#161a22" stroke="#2a3140"/>
    <circle cx="175" cy="345" r="32" fill="none" stroke="#97ce4c" stroke-width="3"/>
    <rect x="90" y="392" width="170" height="10" rx="4" fill="#edeff3"/>
    <rect x="115" y="410" width="120" height="8" rx="4" fill="#4a5468"/>
    <rect x="60" y="425" width="230" height="8" rx="4" fill="#2a3140"/>
  </g>
  <use href="#card-template" x="330" y="0"/>
  <use href="#card-template" x="660" y="0"/>

  <!-- Divider -->
  <line x1="24" y1="470" x2="936" y2="470" stroke="#3a4354" stroke-width="1"/>

  <!-- Error state -->
  <text x="40" y="495" fill="#8a93a6" font-size="13">State C — ERROR (shown if fetch() fails / response not ok)</text>
  <rect x="330" y="510" width="300" height="100" rx="12" fill="#161a22" stroke="#ff6b57"/>
  <text x="480" y="545" fill="#ff6b57" font-size="20" text-anchor="middle">&#9888;</text>
  <text x="480" y="568" fill="#edeff3" font-size="13" text-anchor="middle">Error message + "Try again" button</text>
  <rect x="430" y="580" width="100" height="22" rx="6" fill="#97ce4c"/>

  <!-- Footer -->
  <text x="480" y="630" fill="#4a5468" font-size="11" text-anchor="middle">Footer — API attribution link</text>
</svg>
